name: Link Windows Release

on:
  push:
    tags:
      - 'link-v*'
  pull_request:
    paths:
      - 'apps/link-desktop/**'
      - 'apps/link/**'
      - '.github/workflows/link-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      publish_release:
        description: 'Publish GitHub Release for link-v<version>'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^link-v(.+)$') {
            $v = $Matches[1]
          } elseif ($env:REQUESTED_VERSION) {
            $v = $env:REQUESTED_VERSION
          } else {
            $v = "0.1.0"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a three-part release version." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run link-desktop and link tests
        shell: pwsh
        run: |
          node --test apps/link-desktop/test/link-desktop.test.mjs apps/link/*.test.mjs

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Build SuperAgentLink-Setup-x64.exe
        shell: pwsh
        run: |
          .\apps\link-desktop\scripts\build-windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Verify silent install, heartbeat, and uninstall
        shell: pwsh
        run: |
          node apps/link-desktop/test/installed-link-smoke.mjs apps/link-desktop/dist/SuperAgentLink-Setup-x64.exe "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: superagent-link-windows-x64
          path: |
            apps/link-desktop/dist/SuperAgentLink-Setup-x64.exe
            apps/link-desktop/dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/link-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: link-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SuperAgent Link v${{ steps.ver.outputs.version }}
          files: |
            apps/link-desktop/dist/SuperAgentLink-Setup-x64.exe
            apps/link-desktop/dist/SHA256SUMS.txt

      # A fixed download address that does not depend on which release GitHub marks "Latest" for the whole repo:
      #   https://github.com/<repo>/releases/download/link-latest/SuperAgentLink-Setup-x64.exe
      # Versioned copies stay at .../releases/download/link-v<version>/... . Re-running an older version never
      # moves link-latest backwards.
      - name: Update rolling link-latest release
        if: startsWith(github.ref, 'refs/tags/link-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $tag = 'link-latest'
          $title = "SuperAgent Link v$env:VERSION"
          $notes = "Always the newest SuperAgent Link (currently v$env:VERSION). Versioned installers: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/link-v$env:VERSION"
          $files = @('apps/link-desktop/dist/SuperAgentLink-Setup-x64.exe', 'apps/link-desktop/dist/SHA256SUMS.txt')
          $current = gh release view $tag --json name --jq .name 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $current) {
            gh release create $tag @files --target $env:GITHUB_SHA --title $title --notes $notes --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Could not create $tag." }
            exit 0
          }
          if ($current -match 'v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -gt [version]$env:VERSION) {
            Write-Host "$tag already holds v$($Matches[1]); leaving it."
            exit 0
          }
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not move tag $tag." }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload to $tag." }
          gh release edit $tag --title $title --notes $notes --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Could not update $tag." }
